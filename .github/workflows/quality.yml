name: Quality gate

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site and CMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BROWSER_CHANNEL: chrome
      TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://andrispenarealty.com
      NEXT_PUBLIC_SITE_SETTINGS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Require updated test evidence
        run: npm run test:updates -- "$TEST_BASE_SHA"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: Verify production content configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing GitHub Actions secret NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing GitHub Actions secret NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
      - name: Build GPT Sites artifact
        run: npm run build:sites
      - name: Browser smoke tests for public routes and CMS
        shell: bash
        run: |
          node scripts/serve-for-test.mjs &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3012/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3012/ > /dev/null
          BASE_URL=http://127.0.0.1:3012 npm run test:intro
          BASE_URL=http://127.0.0.1:3012 npm run test:browser
          BASE_URL=http://127.0.0.1:3012 npm run test:cms-browser
      - name: Lighthouse performance and image format audit
        run: npm run test:performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: output/lighthouse/ci
          if-no-files-found: ignore
      - name: Upload browser reports when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: app/output/playwright
          if-no-files-found: ignore
